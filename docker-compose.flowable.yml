version: '3.8'

# ==============================================================================
# Flowable Open Source Engine (Lokal)
# ==============================================================================
# Jalankan dengan perintah:
#   docker compose -f docker-compose.flowable.yml up -d
#
# Cek logs:
#   docker compose -f docker-compose.flowable.yml logs -f
#
# Matikan:
#   docker compose -f docker-compose.flowable.yml down
# ==============================================================================

services:
  flowable-engine:
    image: flowable/all-in-one:latest
    container_name: flowable-engine-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - FLOWABLE_REST_APP_ADMIN_USER_ID=admin
      - FLOWABLE_REST_APP_ADMIN_PASSWORD=test
      - FLOWABLE_COMMON_APP_IDM_ADMIN_USER=admin
      - FLOWABLE_COMMON_APP_IDM_ADMIN_PASSWORD=test
    volumes:
      - flowable_data:/data

volumes:
  flowable_data:
    driver: local


version: '3.8'

services:
  web:
    image: ghcr.io/sabanilahir/peoplehub_app:${APP_TAG:-latest}
    container_name: peoplehub_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - FLOWABLE_URL=http://flowable:8080/flowable-ui/process-api
    depends_on:
      - flowable
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

  flowable:
    image: flowable/flowable-ui:6.8.0
    container_name: peoplehub_flowable
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - JAVA_OPTS=-Xms256m -Xmx768m -Djava.security.egd=file:/dev/./urandom
    volumes:
      - flowable_data:/root/.flowable

volumes:
  flowable_data:
